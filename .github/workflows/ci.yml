name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check tier rules
        run: npm run check
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
      - name: Validate landing static output
        run: test -s landing/dist/index.html

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install deployment SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release source
        env:
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh kliseer-deploy@64.177.42.81 "mkdir -p '/opt/kliseer/releases/$RELEASE'"
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude='.env' --exclude='.env.*' -czf - . |
            ssh kliseer-deploy@64.177.42.81 "tar -xzf - -C '/opt/kliseer/releases/$RELEASE'"
      - name: Build and activate release
        env:
          RELEASE: ${{ github.sha }}
        run: |
          ssh kliseer-deploy@64.177.42.81 "bash -s -- '$RELEASE'" <<'REMOTE'
          set -Eeuo pipefail
          release="/opt/kliseer/releases/$1"
          current="/opt/kliseer/current"
          previous="$(readlink "$current" || true)"
          previous_dir="$(readlink -f "$current" || true)"
          test -f /opt/kliseer/.env.local
          ln -sfn /opt/kliseer/.env.local "$release/.env.local"
          cd "$release"
          npm ci
          npm run db:init
          npm run build
          test -s "$release/landing/dist/index.html"
          if [ ! -L /etc/caddy/Caddyfile ] || [ "$(readlink /etc/caddy/Caddyfile)" != "$current/deploy/Caddyfile" ]; then
            echo 'Caddy preflight failed: /etc/caddy/Caddyfile must symlink to /opt/kliseer/current/deploy/Caddyfile; see deploy/README.md' >&2
            exit 1
          fi
          if [ ! -f /etc/caddy/Caddyfile.pre-kliseer ]; then
            echo 'Caddy preflight failed: expected backup /etc/caddy/Caddyfile.pre-kliseer; see deploy/README.md' >&2
            exit 1
          fi
          caddy validate --config "$release/deploy/Caddyfile" --adapter caddyfile
          rollback() {
            if [ -n "$previous" ]; then
              ln -sfn "$previous" "$current"
              sudo -n /usr/bin/systemctl restart kliseer.service || true
              if [ -f "$previous_dir/deploy/Caddyfile" ]; then
                caddy reload --config "$previous_dir/deploy/Caddyfile" --adapter caddyfile || true
              else
                caddy reload --config /etc/caddy/Caddyfile.pre-kliseer --adapter caddyfile || true
              fi
            fi
          }
          ln -sfn "releases/$1" /opt/kliseer/current.next
          mv -Tf /opt/kliseer/current.next "$current"
          if ! sudo -n /usr/bin/systemctl restart kliseer.service; then
            rollback
            exit 1
          fi
          if ! caddy reload --config "$current/deploy/Caddyfile" --adapter caddyfile; then
            rollback
            exit 1
          fi
          domain=64-177-42-81.sslip.io
          healthy=false
          for attempt in $(seq 1 20); do
            app_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/app || true)"
            caddy_app_status="$(curl --silent --show-error --resolve "$domain:443:127.0.0.1" --output /dev/null --write-out '%{http_code}' "https://$domain/app" || true)"
            if [ "$app_status" = 200 ] && [ "$caddy_app_status" = 200 ] && curl --silent --show-error --fail --resolve "$domain:443:127.0.0.1" "https://$domain/" | cmp -s - "$release/landing/dist/index.html"; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            rollback
            echo 'release health check failed (Caddy landing root or /app backend)' >&2
            exit 1
          fi
          echo 'release healthy (Caddy landing root and /app backend)'
          REMOTE
