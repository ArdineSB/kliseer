name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check tier rules
        run: npm run check
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install deployment SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release source
        env:
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh kliseer-deploy@64.177.42.81 "mkdir -p '/opt/kliseer/releases/$RELEASE'"
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude='.env' --exclude='.env.*' -czf - . |
            ssh kliseer-deploy@64.177.42.81 "tar -xzf - -C '/opt/kliseer/releases/$RELEASE'"
      - name: Build and activate release
        env:
          RELEASE: ${{ github.sha }}
        run: |
          ssh kliseer-deploy@64.177.42.81 "bash -s -- '$RELEASE'" <<'REMOTE'
          set -Eeuo pipefail
          release="/opt/kliseer/releases/$1"
          current="/opt/kliseer/current"
          previous="$(readlink "$current" || true)"
          test -f /opt/kliseer/.env.local
          ln -sfn /opt/kliseer/.env.local "$release/.env.local"
          cd "$release"
          npm ci
          npm run build
          ln -sfn "releases/$1" /opt/kliseer/current.next
          mv -Tf /opt/kliseer/current.next "$current"
          if ! sudo -n /usr/bin/systemctl restart kliseer.service; then
            if [ -n "$previous" ]; then ln -sfn "$previous" /opt/kliseer/current; sudo -n /usr/bin/systemctl restart kliseer.service; fi
            exit 1
          fi
          for attempt in $(seq 1 20); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [ "$status" = 200 ]; then echo 'release healthy (app auth active, home returns 200)'; exit 0; fi
            sleep 2
          done
          if [ -n "$previous" ]; then
            ln -sfn "$previous" /opt/kliseer/current
            sudo -n /usr/bin/systemctl restart kliseer.service
          fi
          echo 'release health check failed' >&2
          exit 1
          REMOTE
